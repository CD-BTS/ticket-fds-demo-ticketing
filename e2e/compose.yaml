# #47 Demo–BTS 실서버 통합 시나리오용 일회성 DB 환경.
# 기존 개발용 컨테이너·볼륨(fairticket-mysql, demo-ticketing-mysql 등)과 이름·포트·데이터를 공유하지 않는다.
# 데이터는 tmpfs에만 저장되므로 `docker compose down` 하면 모두 사라진다.
# 비밀번호는 루프백에서만 쓰는 테스트 값이다. 실제 환경에 재사용하지 않는다.
# ADMIN_REPO: ticket-fds-admin 체크아웃 경로 (기본: 이 저장소와 같은 상위 폴더)
name: cdbts-e2e

services:
  bts-mysql:
    image: mysql:8.0
    container_name: cdbts-e2e-bts-mysql
    ports:
      - "127.0.0.1:3317:3306"
    environment:
      MYSQL_ROOT_PASSWORD: e2e-root-only
      MYSQL_DATABASE: fairticket_db
      MYSQL_USER: bts_e2e
      MYSQL_PASSWORD: bts-e2e-only
      TZ: UTC
    # admin schema.sql의 booking_history/user_card는 utf8mb4_unicode_ci로 고정돼 있어, MySQL 8 기본값(utf8mb4_0900_ai_ci)인
    # user_account.user_id와 FK가 호환되지 않는다(ERROR 3780). 새 DB에서 schema.sql이 실패하므로 서버 기본 collation을 맞춘다.
    command: ["--default-time-zone=+00:00", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    tmpfs:
      - /var/lib/mysql
    volumes:
      - ${ADMIN_REPO:-../../ticket-fds-admin}/backend/db/schema.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
    healthcheck:
      # schema.sql의 마지막 테이블(#67 policy_application)까지 만들어졌는지 확인한다. 새 DB는 schema.sql만으로
      # #62·#67 테이블과 컬럼을 모두 갖추므로 db/manual/*.sql(기존 DB용)은 적용하지 않는다.
      test: ["CMD-SHELL", 'MYSQL_PWD=bts-e2e-only mysql -h127.0.0.1 -ubts_e2e fairticket_db -e "SELECT 1 FROM policy_application LIMIT 1" >/dev/null 2>&1']
      start_period: 30s
      interval: 3s
      timeout: 5s
      retries: 40

  demo-mysql:
    image: mysql:8.0
    container_name: cdbts-e2e-demo-mysql
    ports:
      - "127.0.0.1:3318:3306"
    environment:
      MYSQL_ROOT_PASSWORD: e2e-root-only
      MYSQL_DATABASE: demo_ticketing_db
      MYSQL_USER: demo_e2e
      MYSQL_PASSWORD: demo-e2e-only
      TZ: UTC
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_as_cs", "--default-time-zone=+00:00"]
    tmpfs:
      - /var/lib/mysql
    volumes:
      - ../backend/db/schema.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
      - ../backend/db/seed.sql:/docker-entrypoint-initdb.d/20-seed.sql:ro
      - ../backend/db/02-booking-support.sql:/docker-entrypoint-initdb.d/30-booking-support.sql:ro
      - ../backend/db/03-seat-concurrency.sql:/docker-entrypoint-initdb.d/40-seat-concurrency.sql:ro
      - ../backend/db/04-booking-attempts.sql:/docker-entrypoint-initdb.d/50-booking-attempts.sql:ro
      # #53 QR 검표 시나리오: 기기 바인딩과 검표 챌린지 테이블
      - ../backend/db/05-ticket-device-binding.sql:/docker-entrypoint-initdb.d/60-ticket-device-binding.sql:ro
      - ../backend/db/07-checkin-challenges.sql:/docker-entrypoint-initdb.d/70-checkin-challenges.sql:ro
      # #67 정책 적용 기록: Outbox event_type CHECK에 POLICY_APPLICATION 추가
      - ../backend/db/09-policy-application-outbox.sql:/docker-entrypoint-initdb.d/80-policy-application-outbox.sql:ro
    healthcheck:
      # 마지막 초기화 스크립트(09)까지 끝났는지 확인한다.
      test: ["CMD-SHELL", 'MYSQL_PWD=demo-e2e-only mysql -h127.0.0.1 -udemo_e2e demo_ticketing_db -N -e "SELECT 1 FROM information_schema.check_constraints WHERE constraint_schema=DATABASE() AND constraint_name=''ck_outbox_type'' AND check_clause LIKE ''%POLICY_APPLICATION%''" 2>/dev/null | grep -q 1']
      start_period: 30s
      interval: 3s
      timeout: 5s
      retries: 40

  demo-redis:
    image: redis:7.4-alpine
    container_name: cdbts-e2e-demo-redis
    ports:
      - "127.0.0.1:6390:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
