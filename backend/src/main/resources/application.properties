spring.application.name=demo-ticketing
server.port=${SERVER_PORT:8080}
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3308}/demo_ticketing_db?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# DB의 UTC LocalDateTime을 변환 없이 읽고 쓴다(#46). 없으면 JVM 시간대가 UTC가 아닐 때(예: KST 개발 PC)
# JPA로 읽는 공연 시각이 시간대 차이만큼 밀려 /concerts API와 BTS 공연 동기화 값이 틀어진다.
spring.jpa.properties.hibernate.type.java_time_use_direct_jdbc=true
spring.sql.init.mode=never
server.error.include-message=never
server.error.include-stacktrace=never

# Local demo sessions are separate from BTS service authentication.
demo.hold-duration=${HOLD_DURATION:PT5M}
demo.payment-identifiers=${TEST_PAYMENT_IDENTIFIERS:test-pay-shared-01,test-pay-shared-02,test-pay-shared-03}
demo.jobs.enabled=${DEMO_JOBS_ENABLED:true}
# Enable only after reviewing and applying db/04-booking-attempts.sql.
demo.attempts.enabled=${BOOKING_ATTEMPTS_ENABLED:true}
bts.enabled=${BTS_ENABLED:false}
bts.base-url=${BTS_BASE_URL:}
bts.service-id=${BTS_SERVICE_ID:demo-ticketing}
bts.api-key=${BTS_API_KEY:}
bts.concert-sync-ms=${BTS_CONCERT_SYNC_MS:600000}
# Never infer a client IP from untrusted Forwarded/X-Forwarded-For headers.
server.forward-headers-strategy=none

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6380}
spring.data.redis.username=${REDIS_USERNAME:}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.database=${REDIS_DATABASE:0}
spring.data.redis.connect-timeout=2s
spring.data.redis.timeout=3s
demo.queue.key-prefix=${QUEUE_KEY_PREFIX:demo-ticketing:queue}
demo.queue.capacity=${QUEUE_CAPACITY:100}
demo.queue.wait-ttl=${QUEUE_WAIT_TTL:PT30M}
demo.queue.admit-ttl=${QUEUE_ADMIT_TTL:PT5M}
demo.queue.expired-retention=${QUEUE_EXPIRED_RETENTION:PT10M}

# disabled preserves FIFO ALLOW; mock is local; bts calls the remote QUEUE_JOIN contract.
demo.policy.mode=${POLICY_DECISION_MODE:disabled}
demo.policy.mock-actions=${POLICY_MOCK_ACTIONS:{}}
demo.captcha.mode=${CAPTCHA_MODE:disabled}
demo.captcha.challenge-ttl=${CAPTCHA_CHALLENGE_TTL:PT2M}
demo.captcha.grant-ttl=${CAPTCHA_GRANT_TTL:PT2M}
demo.captcha.max-attempts=${CAPTCHA_MAX_ATTEMPTS:5}
demo.captcha.hcaptcha.site-key=${HCAPTCHA_SITE_KEY:}
demo.captcha.hcaptcha.secret=${HCAPTCHA_SECRET:}
demo.captcha.hcaptcha.verify-url=${HCAPTCHA_VERIFY_URL:https://api.hcaptcha.com/siteverify}

# Dynamic QR / device binding / gate check-in. Enable only after applying db/05-ticket-device-binding.sql.
demo.checkin.enabled=${CHECKIN_ENABLED:false}
# Base64 of 32 random bytes (AES-256-GCM key for stored TOTP secrets). Runtime secret; never log.
demo.checkin.secret-key=${TICKET_SECRET_KEY:}
# Shared gate-staff credential sent as X-Gate-Key. Runtime secret; never log.
demo.checkin.gate-key=${GATE_API_KEY:}
demo.checkin.opens-before=${CHECKIN_OPENS_BEFORE:PT2H}
demo.checkin.challenge-ttl=${DEVICE_CHALLENGE_TTL:PT2M}
# Lifetime of the one-time challenge the registered device must sign after a gate scan (db/07-checkin-challenges.sql).
demo.checkin.gate-challenge-ttl=${CHECKIN_CHALLENGE_TTL:PT15S}
demo.checkin.max-device-changes=${DEVICE_MAX_CHANGES:3}